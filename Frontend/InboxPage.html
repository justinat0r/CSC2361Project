<!DOCTYPE html>
<html>
<head>
<title>Sendrr Inbox</title>

<style>
body {
    font-family: Arial;
    margin: 20px;
    background: #f4f4f4;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.container {
    display: flex;
    gap: 20px;
    margin-top: 20px;
}

.inbox, .compose {
    background: white;
    padding: 15px;
    border-radius: 8px;
    width: 50%;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.email {
    border-bottom: 1px solid #ddd;
    padding: 10px;
    cursor: pointer;
}

.email:hover {
    background: #f1f1f1;
}

textarea, input {
    width: 100%;
    margin-bottom: 10px;
    padding: 8px;
}

button {
    padding: 10px;
    border: none;
    background: #04AA6D;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #45a049;
}

.message-view {
    margin-top: 15px;
    padding: 10px;
    border-top: 1px solid #ccc;
}
</style>
</head>

<body>

<div class="header">
    <h1>Sendrr Inbox</h1>
    <button onclick="logout()">Logout</button>
</div>

<div class="container">

    <!-- INBOX -->
    <div class="inbox">
        <h2>Your Emails</h2>
        <div id="emailList"></div>

        <div class="message-view" id="messageView">
            <h3>Select an email</h3>
        </div>
    </div>

    <!-- COMPOSE -->
    <div class="compose">
        <h2>Compose Email</h2>

        <input id="to" placeholder="Recipient email (user@sendrr.com)">
        <input id="subject" placeholder="Subject">
        <textarea id="body" rows="6" placeholder="Write your message..."></textarea>

        <button onclick="sendEmail()">Send</button>
        <p id="status"></p>
    </div>

</div>

<script>

// LOAD INBOX
async function loadInbox() {
    const res = await fetch("/api/inbox");
    const emails = await res.json();

    const list = document.getElementById("emailList");
    list.innerHTML = "";

    emails.forEach(email => {
        list.innerHTML += `
            <div class="email" onclick="viewEmail('${email.sender}', '${email.subject}', \`${email.body}\`, '${email.sent_at}')">
                <b>${email.sender}</b> - ${email.subject}
            </div>
        `;
    });
}

// VIEW EMAIL
function viewEmail(sender, subject, body, date) {
    document.getElementById("messageView").innerHTML = `
        <h3>${subject}</h3>
        <p><b>From:</b> ${sender}</p>
        <p><b>Date:</b> ${date}</p>
        <hr>
        <p>${body}</p>
    `;
}

// SEND EMAIL
async function sendEmail() {
    const to = document.getElementById("to").value;
    const subject = document.getElementById("subject").value;
    const body = document.getElementById("body").value;

    const res = await fetch("/api/send", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ to, subject, body })
    });

    const data = await res.json();

    document.getElementById("status").innerText = data.message || data.error;

    loadInbox();
}

// LOGOUT
async function logout() {
    const res = await fetch("/api/logout", { method: "POST" });
    const data = await res.json();
    window.location = data.redirect;
}

// AUTO LOAD
loadInbox();

</script>

</body>
</html>
