<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
    margin: 40px;
}

h1 { text-align: center; }

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
}

th {
    background: #333;
    color: white;
}

textarea {
    width: 100%;
    height: 60px;
}
</style>
</head>

<body>

<h1>Admin Dashboard</h1>

<h2>All Emails</h2>
<input id="search" placeholder="Search emails..." onkeyup="loadEmails()">

<table>
<thead>
<tr>
<th>ID</th>
<th>From</th>
<th>To</th>
<th>Subject</th>
<th>Body</th>
<th>Date</th>
</tr>
</thead>
<tbody id="emailTable"></tbody>
</table>

<script>
async function loadEmails() {
    const search = document.getElementById("search").value;

    const res = await fetch(`/api/messages?search=${search}`);
    const emails = await res.json();

    const table = document.getElementById("emailTable");
    table.innerHTML = "";

    emails.forEach(e => {
        table.innerHTML += `
        <tr>
            <td>${e.id}</td>
            <td>${e.user_id}</td>
            <td>(hidden)</td>
            <td>${e.message}</td>
            <td><textarea readonly>${e.message}</textarea></td>
            <td>${e.date}</td>
        </tr>
        `;
    });
}

loadEmails();
</script>

</body>
</html>
