<!DOCTYPE html>

<html>
<head>
<title>Sendrr - Admin Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f5f5f5; min-height: 100vh; }

.topbar {
background: #333;
color: white;
padding: 15px 30px;
display: flex;
justify-content: space-between;
align-items: center;
}

.topbar button {
background: #04AA6D;
color: white;
border: none;
padding: 8px 16px;
cursor: pointer;
border-radius: 4px;
font-size: 13px;
}

.main {
padding: 30px;
max-width: 1200px;
margin: 0 auto;
}

.grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 30px;
margin-bottom: 30px;
}

.panel, .full-width {
background: white;
padding: 25px;
box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

input {
width: 100%;
padding: 8px;
margin-bottom: 10px;
border: 1px solid #ccc;
}

table {
width: 100%;
border-collapse: collapse;
}

th, td {
padding: 10px;
border-bottom: 1px solid #ddd;
font-size: 13px;
}

th {
background: #333;
color: white;
} </style>

</head>
<body>

<div class="topbar">
    <h1>Sendrr — Admin Dashboard</h1>
    <button onclick="logout()">Log Out</button>
</div>

<div class="main">

```
<div class="grid">

    <div class="panel">
        <h2>Users</h2>
        <input id="userSearch" placeholder="Search users..." oninput="loadUsers()">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Region</th>
                    <th>Admin</th>
                </tr>
            </thead>
            <tbody id="usersBody"></tbody>
        </table>
    </div>

    <div class="panel">
        <h2>Messages</h2>
        <input id="messageSearch" placeholder="Search messages..." oninput="loadMessages()">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>From (User ID)</th>
                    <th>Subject</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="messagesBody"></tbody>
        </table>
    </div>

</div>

<div class="full-width">
    <h2>Login Activity</h2>
    <table>
        <thead>
            <tr>
                <th>Session ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>IP Address</th>
                <th>Login Time</th>
                <th>Active</th>
            </tr>
        </thead>
        <tbody id="sessionsBody"></tbody>
    </table>
</div>
```

</div>

<script>
window.onload = function() {
    loadUsers();
    loadMessages();
    loadSessions();
};

// Utility: clear table safely
function clearTable(tbody) {
    while (tbody.firstChild) {
        tbody.removeChild(tbody.firstChild);
    }
}

// Utility: create safe cell
function createCell(value) {
    const td = document.createElement("td");
    td.textContent = value ?? "";
    return td;
}

// Utility: empty state row
function emptyRow(colspan, text) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = colspan;
    td.textContent = text;
    td.style.textAlign = "center";
    td.style.color = "#aaa";
    tr.appendChild(td);
    return tr;
}

async function loadUsers() {
    const search = document.getElementById("userSearch").value;
    const res = await fetch(`/api/users?search=${encodeURIComponent(search)}`);
    if (res.status === 403) { window.location.href = "/login"; return; }

    const users = await res.json();
    const tbody = document.getElementById("usersBody");
    clearTable(tbody);

    if (!users.length) {
        tbody.appendChild(emptyRow(5, "No users found"));
        return;
    }

    users.forEach(u => {
        const tr = document.createElement("tr");

        tr.appendChild(createCell(u.id));
        tr.appendChild(createCell(u.name));
        tr.appendChild(createCell(u.email));
        tr.appendChild(createCell(u.region));
        tr.appendChild(createCell(u.is_admin ? "Yes" : "No"));

        tbody.appendChild(tr);
    });
}

async function loadMessages() {
    const search = document.getElementById("messageSearch").value;
    const res = await fetch(`/api/messages?search=${encodeURIComponent(search)}`);
    if (res.status === 403) { window.location.href = "/login"; return; }

    const messages = await res.json();
    const tbody = document.getElementById("messagesBody");
    clearTable(tbody);

    if (!messages.length) {
        tbody.appendChild(emptyRow(4, "No messages found"));
        return;
    }

    messages.forEach(m => {
        const tr = document.createElement("tr");

        tr.appendChild(createCell(m.id));
        tr.appendChild(createCell(m.user_id));
        tr.appendChild(createCell(m.message));
        tr.appendChild(createCell(m.date));

        tbody.appendChild(tr);
    });
}

async function loadSessions() {
    const res = await fetch("/api/sessions");
    if (res.status === 403) { window.location.href = "/login"; return; }

    const sessions = await res.json();
    const tbody = document.getElementById("sessionsBody");
    clearTable(tbody);

    if (!sessions.length) {
        tbody.appendChild(emptyRow(6, "No login activity yet"));
        return;
    }

    sessions.forEach(s => {
        const tr = document.createElement("tr");

        tr.appendChild(createCell(s.session_id));
        tr.appendChild(createCell(s.username));
        tr.appendChild(createCell(s.email));
        tr.appendChild(createCell(s.ip_address));
        tr.appendChild(createCell(s.login_at));
        tr.appendChild(createCell(s.is_active ? "Yes" : "No"));

        tbody.appendChild(tr);
    });
}

async function logout() {
    await fetch("/api/logout", { method: "POST" });
    window.location.href = "/login";
}
</script>

</body>
</html>
