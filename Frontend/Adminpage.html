<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>
<style>
body{
font-family:Arial;
background:#f5f5f5;
margin:40px;
}

h1{
text-align:center;
}

.container{
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
}

th{
background:#333;
color:white;
}

input{
width:100%;
padding:8px;
margin-bottom:10px;
}
</style>
</head>
<body>
<h1>Admin Dashboard</h1>
<div class="container">
<div>
<h2>Users</h2>
<input
id="userSearch"
placeholder="Search users..."
onkeyup="loadUsers()"
/>
<table id="users">
<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>
<div>
<h2>Messages</h2>
<input id="messageSearch" placeholder="Search messages..." onkeyup="loadMessages()"/>
<table id="messages">
<thead>
<tr>
<th>ID</th>
<th>User ID</th>
<th>Message</th>
<th>Date</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>
</div>
<script>

async function loadUsers() {
const search = document.getElementById("userSearch").value;
const res = await fetch(`/api/users?search=${search}`);
const users = await res.json();
const table = document.querySelector("#users tbody");

table.innerHTML="";
users.forEach(u=>{
table.innerHTML += `<tr>
<td>${u.id}</td>
<td>${u.name}</td>
<td>${u.email}</td>
</tr>`;
});
}

async function loadMessages() {

const search = document.getElementById("messageSearch").value;
const res = await fetch(`/api/messages?search=${search}`);
const messages = await res.json();
const table = document.querySelector("#messages tbody");

table.innerHTML="";

messages.forEach(m=>{

table.innerHTML += `
<tr>
<td>${m.id}</td>
<td>${m.user_id}</td>
<td>${m.message}</td>
<td>${m.date}</td>
</tr>
`;

});
}
loadUsers();
loadMessages();
</script>
</body>
</html>
