
<!DOCTYPE html>
<html>
<head>
<title>Sendrr - Sign Up</title>

<style>
body { font-family: Arial; margin: 40px; }

input, select {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
}

button {
    background: #04AA6D;
    color: white;
    padding: 10px;
    border: none;
    cursor: pointer;
}

button:hover { background: #45a049; }
</style>
</head>

<body>

<h1>Sendrr</h1>
<h2>Sign Up</h2>

<input id="username" placeholder="Username (no @sendrr.com)">
<input id="email" placeholder="Email (user@sendrr.com)">
<input id="password" type="password" placeholder="Password">
<input id="repeat" type="password" placeholder="Repeat Password">

<select id="region">
    <option value="NA">North America</option>
    <option value="CA">Central America</option>
    <option value="SA">South America</option>
    <option value="EEU">Eastern Europe</option>
    <option value="WEU">Western Europe</option>
    <option value="SWA">Southwestern Asia</option>
    <option value="NEA">Northeastern Asia</option>
    <option value="NAF">Northern Africa</option>
    <option value="SAF">Southern Africa</option>
    <option value="OC">Oceania</option>
</select>

<button onclick="signup()">Create Account</button>

<p id="status"></p>

<script>
async function signup() {
    const username = document.getElementById("username").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const repeat = document.getElementById("repeat").value;
    const region = document.getElementById("region").value;

    if (password !== repeat) {
        document.getElementById("status").innerText = "Passwords do not match";
        return;
    }

    const res = await fetch("/api/signup", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ username, email, password, region })
    });

    const data = await res.json();

    if (res.status === 201) {
        document.getElementById("status").innerText = "Account created! Redirecting...";
        setTimeout(() => window.location = "/login", 1500);
    } else {
        document.getElementById("status").innerText = data.error;
    }
}
</script>

</body>
</html>
